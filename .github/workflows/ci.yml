# CI da V2. A da V1 saiu junto com ela (6c5d689) e nada a substituiu: a suíte
# de integração do api-java chegou a ficar quebrada no main sem ninguém ver.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # verify = testes (os de integração sobem Postgres pelo Testcontainers,
      # com o Docker do runner) + -Werror do javac (ST-45) + piso de cobertura
      # da JaCoCo (ST-44). Redis não sobe: o rate limit falha aberto sem ele.
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cobertura-api
          path: api/target/site/jacoco/

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Os testes do web espelham regras do back-end (rotas que exigem
      # Idempotency-Key) e conferem a cópia lendo o fonte Java; também guardam
      # os cabeçalhos de segurança dos dois vercel.json.
      - run: npm run lint
      - run: npm test
      - run: npm run build

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # O app duplica a máquina de estados da consulta; o teste compara com o Java.
      - run: npm run typecheck
      - run: npm test
