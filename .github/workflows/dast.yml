name: dast-zap

# Teste dinâmico (DAST) com OWASP ZAP contra um ambiente de homologação já no ar
# (Padrão 10). Rodado sob demanda ou agendado — NÃO no PR (precisa de alvo vivo).

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL base do ambiente de homologação (https://...)"
        required: true
  schedule:
    - cron: "0 3 * * 1" # toda segunda 03:00 UTC

permissions:
  contents: read
  issues: write

jobs:
  zap-baseline:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: OWASP ZAP Baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ github.event.inputs.target_url || vars.STAGING_URL }}
          fail_action: true
          cmd_options: "-a"
