# Gates de segurança. O .gitignore cita um "gate de gitleaks bloqueante
# (invariante 12)" que não existia em workflow nenhum.
name: seguranca

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Semanal: advisory novo aparece para dependência que já estava no main.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  segredos:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # O gitleaks-action lista os commits do PR pela API.
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Reprova PR que traz dependência com vulnerabilidade conhecida (Maven e npm),
  # pelo banco de advisories do GitHub.
  #
  # O dependency review depende do Dependency graph do repositório. Desligado,
  # a action falha em todo PR com "Dependency review is not supported", sem
  # olhar dependência nenhuma. Aqui a sonda consulta a mesma API que a action
  # usa: só o 403 (a resposta que a action traduz como "not supported") pula a
  # revisão, e com aviso no resumo do job. Qualquer outro erro segue para a
  # action, que reprova como antes.
  dependencias:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: grafo
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARACAO: repos/${{ github.repository }}/dependency-graph/compare/${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}
        run: |
          if resposta=$(gh api "$COMPARACAO" 2>&1); then
            echo "ativo=sim" >> "$GITHUB_OUTPUT"
          elif echo "Resposta da API: $resposta" && grep -qE 'HTTP 403' <<<"$resposta"; then
            # É o mesmo critério da action: todo 403 dessa API ela reporta
            # como "Dependency review is not supported on this repository".
            echo "ativo=nao" >> "$GITHUB_OUTPUT"
            aviso="Dependency graph desligado: dependências deste PR NÃO foram revisadas. Ative em Settings → Code security → Dependency graph."
            echo "::warning::$aviso"
            echo "$aviso" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ativo=sim" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.grafo.outputs.ativo == 'sim'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        linguagem: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      # build-mode none: analisa o fonte sem compilar, então não depende do
      # Testcontainers nem do Maven Central estarem de pé.
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.linguagem }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
