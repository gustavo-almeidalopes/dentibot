spring:
  application:
    name: dentibot-api

  # A aplicação conecta como dentibot_app: sem posse de tabela, sem superusuário.
  # Se algum dia alguém apontar isto para o role dono, o RLS para de valer sem
  # nenhum erro aparecer — ver docs/architecture/tenancy.md.
  datasource:
    url: ${DENTIBOT_DB_URL}
    username: ${DENTIBOT_DB_USER:dentibot_app}
    password: ${DENTIBOT_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DENTIBOT_DB_POOL:10}
      pool-name: dentibot-app

  # Flyway tem credencial própria, de um role que é dono do schema e não é a app.
  flyway:
    enabled: true
    url: ${DENTIBOT_DB_URL}
    user: ${DENTIBOT_DB_MIGRADOR_USER:dentibot_migrador}
    password: ${DENTIBOT_DB_MIGRADOR_PASSWORD}
    schemas: plataforma
    default-schema: plataforma
    create-schemas: true
    validate-on-migrate: true
    # Migration aplicada nunca muda (invariante 13). Se o checksum divergir, é
    # porque alguém editou — e o certo é falhar, não "reparar".
    clean-disabled: true

  data:
    redis:
      url: ${DENTIBOT_REDIS_URL:redis://localhost:6379}
      # Redis cair degrada, não corrompe (camada 11). Timeout curto para não
      # segurar a requisição esperando o cache.
      timeout: 500ms
      connect-timeout: 500ms

  threads:
    virtual:
      enabled: true

dentibot:
  # O token de sessão do Clerk precisa trazer o e-mail verificado. Sem isso o
  # cadastro de clínica responde 400 e o membro admitido pela equipe nunca é
  # vinculado no primeiro login. No painel (Sessions > Customize session token),
  # ou por `clerk config patch`, em session.claims:
  #   { "email": "{{user.primary_email_address}}",
  #     "email_verified": "{{user.email_verified}}" }
  clerk:
    # A Frontend API da instância, exatamente como vem no claim `iss` do token.
    # É daqui que sai a URL do JWKS; sem ela nenhuma rota autenticada funciona.
    # Não é segredo (é público e vai no bundle do front), mas continua vindo de
    # variável porque muda entre ambientes.
    emissor: ${DENTIBOT_CLERK_ISSUER:}
    # Origens que o claim `azp` pode conter. Obrigatória: vazia, a aplicação não
    # sobe, em vez de aceitar token emitido para qualquer site.
    partes-autorizadas: ${DENTIBOT_CLERK_ORIGINS:http://localhost:5173}
  cors:
    origens: ${DENTIBOT_CORS_ORIGINS:http://localhost:5173}
  # Credencial do Prometheus em /actuator/prometheus (usuário "prometheus").
  # Vazia = endpoint fechado para todos: não existe senha padrão.
  metricas:
    senha: ${DENTIBOT_METRICAS_SENHA:}
  # ST-41: anexos clínicos num bucket S3-compatível — R2 em produção (região
  # "auto"), MinIO em dev. Sem endpoint ou credencial, anexo responde 503 e o
  # resto sobe normal. O bucket precisa aceitar CORS de PUT da origem do web.
  anexos:
    endpoint: ${DENTIBOT_S3_ENDPOINT:}
    regiao: ${DENTIBOT_S3_REGIAO:auto}
    bucket: ${DENTIBOT_S3_BUCKET:dentibot-anexos}
    chave-acesso: ${DENTIBOT_S3_CHAVE:}
    segredo: ${DENTIBOT_S3_SEGREDO:}
  # Doc 03-B: gateway de IA (ST-61). Sem chave, todo recurso de IA responde 503
  # e o resto do sistema não percebe. Ver docs/ia/politica.md.
  ia:
    chave: ${DENTIBOT_IA_CHAVE:}
    # claude-opus-5 por padrão. Trocar por um modelo mais barato (claude-sonnet-5:
    # US$ 2 / 10) é decisão de custo da operação: mude o modelo E os dois preços.
    modelo: ${DENTIBOT_IA_MODELO:claude-opus-5}
    url: ${DENTIBOT_IA_URL:https://api.anthropic.com}
    # US$ por milhão de tokens do modelo acima (tabela da Anthropic). É daqui
    # que sai o custo que a clínica vê (IA-59) e o que a cota mensal consome.
    preco-entrada-usd-mtok: ${DENTIBOT_IA_PRECO_ENTRADA:5.00}
    preco-saida-usd-mtok: ${DENTIBOT_IA_PRECO_SAIDA:25.00}
  # Doc 03-D: WhatsApp Cloud API da Meta. Sem token nada sai (as mensagens ficam
  # programadas); sem segredo do app nenhum webhook é aceito. O modelo precisa
  # estar aprovado no Business Manager com um único parâmetro de corpo.
  whatsapp:
    token: ${DENTIBOT_WHATSAPP_TOKEN:}
    segredo-do-app: ${DENTIBOT_WHATSAPP_SEGREDO_DO_APP:}
    token-de-verificacao: ${DENTIBOT_WHATSAPP_TOKEN_DE_VERIFICACAO:}
    modelo: ${DENTIBOT_WHATSAPP_MODELO:dentibot_aviso}
  # Vazio = Sentry desligado. O DSN não é segredo forte, mas muda por ambiente.
  sentry:
    dsn: ${SENTRY_DSN:}
    ambiente: ${DENTIBOT_AMBIENTE:local}
  # Camada de DENTRO do rate limit. A camada de borda (Cloudflare) barra volume
  # antes de consumir thread da aplicação — as duas existem e fazem coisas
  # diferentes (camada 12).
  ratelimit:
    # Apertado: /api/v1/auth/cadastro cria clínica e é a rota que roda sem
    # tenant. Tentativa de senha não passa mais por aqui — é do Clerk.
    auth-por-minuto: ${DENTIBOT_RATELIMIT_AUTH:10}
    geral-por-minuto: ${DENTIBOT_RATELIMIT_GERAL:300}
    janela: PT1M

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  # native, e não framework: o ForwardedHeaderFilter do modo framework aceita
  # X-Forwarded-For de QUALQUER origem. Quem chamasse a origem direto escolheria
  # o próprio IP, e com ele o balde do rate limit de /auth e o ipOrigem da
  # auditoria. No native, o Tomcat só lê o cabeçalho quando a conexão vem de um
  # proxy conhecido: faixas privadas e loopback por padrão, que cobrem o
  # balanceador de uma plataforma. Com Cloudflare direto na origem, liste as
  # faixas dele em SERVER_TOMCAT_REMOTEIP_TRUSTED_PROXIES (regex) — e feche a
  # origem para quem não é Cloudflare, senão o IP da borda vira o do atacante.
  forward-headers-strategy: native

management:
  endpoints:
    web:
      exposure:
        # prometheus agora com o registry no pom (ST-25) e atrás de credencial
        # própria — ver CadeiaDeSeguranca.metricas. info não tem conteúdo.
        include: health,prometheus
  endpoint:
    health:
      # never, e não when-authorized: sem papel configurado, "autorizado" é
      # qualquer usuário autenticado — a recepcionista de qualquer clínica via
      # banco, Redis e disco. Diagnóstico é pelo log, não pela API pública.
      show-details: never
      # ST-26: /health/liveness pergunta "o processo está vivo?" e não toca em
      # nada externo — senão um banco lento faz o orquestrador matar instância
      # sadia. /health/readiness pergunta "pode receber tráfego?" e aí o banco
      # entra. Redis fica fora das duas: o rate limit falha aberto sem ele.
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: true

logging:
  level:
    root: INFO
    br.com.dentibot: ${DENTIBOT_LOG_LEVEL:INFO}
  pattern:
    # correlacaoId no padrão de log é o que permite responder "sumiu a agenda de
    # ontem" com log em vez de chute.
    # %wEx explícito: é a palavra que o logback-spring.xml troca pelo conversor
    # que tira CPF e e-mail da exceção. Sem ela no padrão, o Logback anexa o
    # próprio conversor de exceção, sem limpeza.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlacaoId:-}] %logger{36} - %msg%n%wEx"

# ST-20: o contrato OpenAPI. Desligado por padrão — em produção /v3/api-docs dá
# 404 e não mapa da API a quem bate na porta. O teste de contrato liga, gera e
# compara com api/openapi.json; o dev liga com DENTIBOT_OPENAPI=true.
springdoc:
  api-docs:
    enabled: ${DENTIBOT_OPENAPI:false}
    version: openapi_3_1
  writer-with-order-by-keys: true
  writer-with-default-pretty-printer: true
  packages-to-scan: br.com.dentibot
