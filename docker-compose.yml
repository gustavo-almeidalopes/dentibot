version: '3.8'

# ─── Escala horizontal ────────────────────────────────────────────────────────
# Para escalar qualquer serviço:
#   docker compose up --scale gateway=3 --scale patient-service=2 -d
#
# Os serviços internos NÃO expõem portas no host (escalabilidade + isolamento
# east-west); apenas o frontend é acessível externamente. O nginx-lb distribui
# requisições entre as instâncias do gateway.
#
# ADR-0001: um único PostgreSQL (com RLS multi-tenant) substitui os 7 MySQL.
# Todos os serviços conectam como `dentibot_app` (privilégio mínimo), nunca root.
# ─────────────────────────────────────────────────────────────────────────────

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - dentibot-network

# Variáveis comuns de banco/infra injetadas em cada serviço de aplicação.
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg2://${DB_APP_USER:-dentibot_app}:${DB_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:-dentibot_escrita}
  JWT_SECRET: ${JWT_SECRET}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}

services:

  # ─── Banco de Dados único – PostgreSQL 16 (escrita + RLS) ────────────────────
  postgres:
    <<: *service-defaults
    build: ./docker/postgres        # imagem custom com pg_cron + pgaudit
    container_name: dentibot-postgres
    command:
      - "postgres"
      - "-c"
      - "shared_preload_libraries=pg_cron,pgaudit"
      - "-c"
      - "cron.database_name=${POSTGRES_DB:-dentibot_escrita}"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dentibot_escrita}
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      # Disponíveis para o script de credenciais (99-credentials.sh):
      POSTGRES_SUPERUSER_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD}
      DB_TOKENIZER_PASSWORD: ${DB_TOKENIZER_PASSWORD}
      DB_REPLICATOR_PASSWORD: ${DB_REPLICATOR_PASSWORD}
    ports:
      # Exposto só para depuração local; remover/limitar em produção.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/db_escrita.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/02-auth-extensions.sql:/docker-entrypoint-initdb.d/02-auth-extensions.sql:ro
      - ./database/03-domain-extensions.sql:/docker-entrypoint-initdb.d/03-domain-extensions.sql:ro
      - ./database/04-audit-extensions.sql:/docker-entrypoint-initdb.d/04-audit-extensions.sql:ro
      - ./database/05-tokenization-extensions.sql:/docker-entrypoint-initdb.d/05-tokenization-extensions.sql:ro
      - ./database/init-credentials.sh:/docker-entrypoint-initdb.d/99-credentials.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_SUPERUSER:-postgres} -d ${POSTGRES_DB:-dentibot_escrita}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Redis – rate limiting (Flask-Limiter) + blocklist de JTI ────────────────
  redis:
    <<: *service-defaults
    image: redis:7-alpine
    container_name: dentibot-redis
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ─── Load Balancer (distribui entre instâncias do gateway) ───────────────────
  nginx-lb:
    <<: *service-defaults
    image: nginx:1.25-alpine
    container_name: dentibot-nginx-lb
    volumes:
      - ./docker/nginx-lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API Gateway (PEP: authz, rate limit, propagação de tenant) ──────────────
  gateway:
    <<: *service-defaults
    build: ./gateway
    environment:
      <<: *app-env
      AUTH_SERVICE_URL:          http://auth-service:5001
      PATIENT_SERVICE_URL:       http://patient-service:5002
      APPOINTMENT_SERVICE_URL:   http://appointment-service:5003
      INVENTORY_SERVICE_URL:     http://inventory-service:5004
      COMMUNICATION_SERVICE_URL: http://communication-service:5005
      FINANCIAL_SERVICE_URL:     http://financial-service:5006
      AUDIT_SERVICE_URL:         http://audit-service:5007
      FRONTEND_ORIGIN:           ${FRONTEND_ORIGIN:-https://localhost}
    depends_on:
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started

  # ─── Auth Service ─────────────────────────────────────────────────────────────
  auth-service:
    <<: *service-defaults
    build: ./services/auth-service
    environment:
      <<: *app-env
      PASSWORD_PEPPER: ${PASSWORD_PEPPER}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      MAIL_SERVER:   ${MAIL_SERVER}
      MAIL_PORT:     ${MAIL_PORT}
      MAIL_USE_TLS:  ${MAIL_USE_TLS}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      PORT: 5001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Patient Service ────────────────────────────────────────────────────────
  patient-service:
    <<: *service-defaults
    build: ./services/patient-service
    environment:
      <<: *app-env
      # Role/segredo do vault de tokenização de PII (Fase 8).
      TOKEN_VAULT_AES_KEY: ${TOKEN_VAULT_AES_KEY}
      DB_TOKENIZER_USER: ${DB_TOKENIZER_USER:-dentibot_tokenizer}
      DB_TOKENIZER_PASSWORD: ${DB_TOKENIZER_PASSWORD}
      PORT: 5002
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Appointment Service ──────────────────────────────────────────────────────
  appointment-service:
    <<: *service-defaults
    build: ./services/appointment-service
    environment:
      <<: *app-env
      PATIENT_SERVICE_URL: http://patient-service:5002
      PORT: 5003
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Inventory Service ────────────────────────────────────────────────────────
  inventory-service:
    <<: *service-defaults
    build: ./services/inventory-service
    environment:
      <<: *app-env
      PORT: 5004
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Communication Service (sem banco) ────────────────────────────────────────
  communication-service:
    <<: *service-defaults
    build: ./services/communication-service
    environment:
      JWT_SECRET:    ${JWT_SECRET}
      REDIS_URL:     ${REDIS_URL:-redis://redis:6379/0}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      MAIL_SERVER:   ${MAIL_SERVER}
      MAIL_PORT:     ${MAIL_PORT}
      MAIL_USE_TLS:  ${MAIL_USE_TLS}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      TWILIO_SID:    ${TWILIO_SID}
      TWILIO_TOKEN:  ${TWILIO_TOKEN}
      TWILIO_PHONE:  ${TWILIO_PHONE}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID}
      PORT: 5005
    depends_on:
      redis:
        condition: service_healthy

  # ─── Financial Service ────────────────────────────────────────────────────────
  financial-service:
    <<: *service-defaults
    build: ./services/financial-service
    environment:
      <<: *app-env
      PORT: 5006
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Audit Service (append-only / WORM) ───────────────────────────────────────
  audit-service:
    <<: *service-defaults
    build: ./services/audit-service
    environment:
      <<: *app-env
      PORT: 5007
    depends_on:
      postgres:
        condition: service_healthy

  # ─── Frontend (Nginx estático com TLS + proxy para o gateway) ──────────────────
  frontend:
    <<: *service-defaults
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: dentibot-frontend
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - gateway

networks:
  dentibot-network:
    driver: bridge

volumes:
  postgres_data:
