version: '3.8'

# ─── Escala horizontal ────────────────────────────────────────────────────────
# Para escalar qualquer serviço:
#   docker compose up --scale gateway=3 --scale patient-service=2 -d
#
# Os serviços internos NÃO expõem portas no host (escalabilidade);
# apenas o frontend (porta 80) é acessível externamente.
# O nginx-lb distribui requisições entre as instâncias do gateway.
# ─────────────────────────────────────────────────────────────────────────────

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - dentibot-network

services:

  # ─── Banco de Dados – Master (Escrita) ───────────────────────────────────────
  mysql-master:
    <<: *service-defaults
    image: mysql:8.0
    container_name: dentibot-mysql-master
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: dentibot
    ports:
      - "3306:3306"
    volumes:
      - mysql_master_data:/var/lib/mysql
      - ./docker/mysql/master.cnf:/etc/mysql/conf.d/master.cnf:ro
      - ./docker/mysql/init-master.sql:/docker-entrypoint-initdb.d/init-master.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Banco de Dados – Replica (Leitura) ──────────────────────────────────────
  mysql-replica:
    <<: *service-defaults
    image: mysql:8.0
    container_name: dentibot-mysql-replica
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_replica_data:/var/lib/mysql
      - ./docker/mysql/replica.cnf:/etc/mysql/conf.d/replica.cnf:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      mysql-master:
        condition: service_healthy

  # ─── Setup de Replicação (roda uma vez e encerra) ────────────────────────────
  replication-setup:
    image: mysql:8.0
    networks:
      - dentibot-network
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
    command: >
      bash -c "
        echo 'Aguardando mysql-master...' &&
        until mysql -h mysql-master -u root -p$${MYSQL_ROOT_PASSWORD} -e 'SELECT 1' 2>/dev/null; do sleep 3; done &&
        echo 'Aguardando mysql-replica...' &&
        until mysql -h mysql-replica -u root -p$${MYSQL_ROOT_PASSWORD} -e 'SELECT 1' 2>/dev/null; do sleep 3; done &&
        echo 'Configurando replicação GTID...' &&
        mysql -h mysql-replica -u root -p$${MYSQL_ROOT_PASSWORD} -e \"
          STOP REPLICA;
          CHANGE REPLICATION SOURCE TO
            SOURCE_HOST='mysql-master',
            SOURCE_USER='replicator',
            SOURCE_PASSWORD='$${REPLICATION_PASSWORD}',
            SOURCE_AUTO_POSITION=1;
          START REPLICA;
          SHOW REPLICA STATUS\\G;
        \" &&
        echo 'Replicação configurada com sucesso.'
      "
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy
    restart: "no"

  # ─── Load Balancer (distribui entre instâncias do gateway) ───────────────────
  nginx-lb:
    <<: *service-defaults
    image: nginx:1.25-alpine
    container_name: dentibot-nginx-lb
    volumes:
      - ./docker/nginx-lb/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── API Gateway (escalável) ──────────────────────────────────────────────────
  gateway:
    <<: *service-defaults
    build: ./gateway
    environment:
      AUTH_SERVICE_URL:          http://auth-service:5001
      PATIENT_SERVICE_URL:       http://patient-service:5002
      APPOINTMENT_SERVICE_URL:   http://appointment-service:5003
      INVENTORY_SERVICE_URL:     http://inventory-service:5004
      COMMUNICATION_SERVICE_URL: http://communication-service:5005
      FINANCIAL_SERVICE_URL:     http://financial-service:5006
      AUDIT_SERVICE_URL:         http://audit-service:5007
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - auth-service
      - patient-service
      - appointment-service
      - inventory-service
      - communication-service
      - financial-service
      - audit-service

  # ─── Auth Service (escalável) ─────────────────────────────────────────────────
  auth-service:
    <<: *service-defaults
    build: ./services/auth-service
    environment:
      DATABASE_URL:      mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql-master/dentibot_auth
      DATABASE_READ_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql-replica/dentibot_auth
      JWT_SECRET:        ${JWT_SECRET}
      MAIL_SERVER:       ${MAIL_SERVER}
      MAIL_PORT:         ${MAIL_PORT}
      MAIL_USE_TLS:      ${MAIL_USE_TLS}
      MAIL_USERNAME:     ${MAIL_USERNAME}
      MAIL_PASSWORD:     ${MAIL_PASSWORD}
      PORT: 5001
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy

  # ─── Patient Service (escalável) ──────────────────────────────────────────────
  patient-service:
    <<: *service-defaults
    build: ./services/patient-service
    environment:
      DATABASE_URL:      mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql-master/dentibot_patients
      DATABASE_READ_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql-replica/dentibot_patients
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5002
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy

  # ─── Appointment Service (escalável) ──────────────────────────────────────────
  appointment-service:
    <<: *service-defaults
    build: ./services/appointment-service
    environment:
      DATABASE_URL:        mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql-master/dentibot_appointments
      DATABASE_READ_URL:   mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql-replica/dentibot_appointments
      JWT_SECRET:          ${JWT_SECRET}
      PATIENT_SERVICE_URL: http://patient-service:5002
      PORT: 5003
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy

  # ─── Inventory Service (escalável) ────────────────────────────────────────────
  inventory-service:
    <<: *service-defaults
    build: ./services/inventory-service
    environment:
      DATABASE_URL:      mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql-master/dentibot_inventory
      DATABASE_READ_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql-replica/dentibot_inventory
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5004
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy

  # ─── Communication Service (escalável, sem banco) ─────────────────────────────
  communication-service:
    <<: *service-defaults
    build: ./services/communication-service
    environment:
      JWT_SECRET:    ${JWT_SECRET}
      MAIL_SERVER:   ${MAIL_SERVER}
      MAIL_PORT:     ${MAIL_PORT}
      MAIL_USE_TLS:  ${MAIL_USE_TLS}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      TWILIO_SID:    ${TWILIO_SID}
      TWILIO_TOKEN:  ${TWILIO_TOKEN}
      TWILIO_PHONE:  ${TWILIO_PHONE}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN}
      PORT: 5005

  # ─── Financial Service (escalável) ────────────────────────────────────────────
  financial-service:
    <<: *service-defaults
    build: ./services/financial-service
    environment:
      DATABASE_URL:      mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql-master/dentibot_financial
      DATABASE_READ_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql-replica/dentibot_financial
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5006
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy

  # ─── Audit Service (escalável) ────────────────────────────────────────────────
  audit-service:
    <<: *service-defaults
    build: ./services/audit-service
    environment:
      DATABASE_URL:      mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql-master/dentibot_audit
      DATABASE_READ_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql-replica/dentibot_audit
      JWT_SECRET: ${JWT_SECRET}
      PORT: 5007
    depends_on:
      mysql-master:
        condition: service_healthy
      mysql-replica:
        condition: service_healthy

  # ─── Frontend (Nginx estático + proxy para LB) ────────────────────────────────
  frontend:
    <<: *service-defaults
    build: ./frontend
    container_name: dentibot-frontend
    ports:
      - "80:80"
    depends_on:
      - nginx-lb

networks:
  dentibot-network:
    driver: bridge

volumes:
  mysql_master_data:
  mysql_replica_data:
