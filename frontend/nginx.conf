server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache para assets estáticos
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Landing page
    location = / {
        try_files /index.html =404;
    }

    # Páginas do sistema
    location /src/ {
        try_files $uri $uri/ =404;
    }

    # Páginas de erro HTTP personalizadas
    error_page 400 /src/pages/400.html;
    error_page 401 /src/pages/401.html;
    error_page 402 /src/pages/402.html;
    error_page 403 /src/pages/403.html;
    error_page 404 /src/pages/404.html;
    error_page 405 /src/pages/405.html;
    error_page 406 /src/pages/406.html;
    error_page 407 /src/pages/407.html;
    error_page 408 /src/pages/408.html;
    error_page 409 /src/pages/409.html;
    error_page 410 /src/pages/410.html;
    error_page 411 /src/pages/411.html;
    error_page 412 /src/pages/412.html;
    error_page 413 /src/pages/413.html;
    error_page 414 /src/pages/414.html;
    error_page 415 /src/pages/415.html;
    error_page 416 /src/pages/416.html;
    error_page 417 /src/pages/417.html;
    error_page 418 /src/pages/418.html;
    error_page 421 /src/pages/421.html;
    error_page 422 /src/pages/422.html;
    error_page 423 /src/pages/423.html;
    error_page 424 /src/pages/424.html;
    error_page 425 /src/pages/425.html;
    error_page 426 /src/pages/426.html;
    error_page 428 /src/pages/428.html;
    error_page 429 /src/pages/429.html;
    error_page 431 /src/pages/431.html;
    error_page 451 /src/pages/451.html;
    error_page 500 /src/pages/500.html;
    error_page 501 /src/pages/501.html;
    error_page 502 /src/pages/502.html;
    error_page 503 /src/pages/503.html;
    error_page 504 /src/pages/504.html;
    error_page 505 /src/pages/505.html;
    error_page 506 /src/pages/506.html;
    error_page 507 /src/pages/507.html;
    error_page 508 /src/pages/508.html;
    error_page 510 /src/pages/510.html;
    error_page 511 /src/pages/511.html;

    # Proxy para API Gateway
    location /api/ {
        proxy_pass http://gateway:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Health check do nginx
    location /nginx-health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
