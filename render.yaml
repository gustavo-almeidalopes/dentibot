# Blueprint da Render: a API (imagem de api/Dockerfile) e o Redis dela.
#
# A Vercel publica só o web/; a API, que é Spring Boot, precisa de um lugar que
# rode contêiner. Este arquivo é esse lugar. Na Render: New → Blueprint → este
# repositório. O passo a passo inteiro, com o banco, está no README em
# "A API não vai junto".
#
# O Postgres NÃO está aqui de propósito: é o Neon (ver docs/security/
# subprocessadores.md). O isolamento entre clínicas depende de a aplicação
# conectar com um role que não é dono de nada, e isso pede os roles criados à
# mão uma vez — infrastructure/neon/roles.sql. Um banco criado por este arquivo
# viria com um único usuário dono de tudo, que é exatamente a V1 que vazava.
#
# Região virginia porque o Neon fica em us-east-1: cada requisição faz várias
# consultas, e API e banco em continentes diferentes multiplicam a latência.

services:
  - type: web
    # O endereço público sai do nome: https://dentibot-api.onrender.com. Se a
    # Render der outro (nome já usado), troque nos dois vercel.json e no
    # VITE_API_BASE da Vercel.
    name: dentibot-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    region: virginia
    # free dorme após 15 min sem tráfego e a primeira requisição espera a JVM
    # subir (~1 min). Para clínica de verdade, starter.
    plan: free
    # readiness inclui o banco: deploy novo só recebe tráfego quando conecta.
    healthCheckPath: /actuator/health/readiness
    autoDeploy: true
    envVars:
      # Endereço JDBC do Neon, conexão direta (sem "-pooler"), banco dentibot:
      #   jdbc:postgresql://ep-xxx.us-east-1.aws.neon.tech/dentibot?sslmode=require
      # Usuário e senha NÃO vão na URL: são as variáveis abaixo.
      - key: DENTIBOT_DB_URL
        sync: false
      - key: DENTIBOT_DB_PASSWORD
        sync: false
      - key: DENTIBOT_DB_MIGRADOR_PASSWORD
        sync: false
      # As migrations rodam no start, com o role migrador; o app conecta com
      # dentibot_app. Os nomes são os padrões do application.yml.
      - key: DENTIBOT_REDIS_URL
        fromService:
          type: keyvalue
          name: dentibot-redis
          property: connectionString
      # O emissor do Clerk é o mesmo host que está na CSP dos vercel.json. Não
      # é segredo: é público e já vai no bundle do web.
      - key: DENTIBOT_CLERK_ISSUER
        value: https://subtle-tick-4973.clerk.accounts.dev
      # A origem do site na Vercel, sem barra no fim (ex.: https://dentibot.vercel.app).
      # Sem ela no CLERK_ORIGINS, o token do login é recusado; sem ela no
      # CORS, o navegador bloqueia a resposta.
      - key: DENTIBOT_CLERK_ORIGINS
        sync: false
      - key: DENTIBOT_CORS_ORIGINS
        sync: false
      - key: DENTIBOT_AMBIENTE
        value: producao

  # Só o rate limit usa, e ele falha aberto sem Redis: estado temporário,
  # nunca fonte de verdade. Por isso allkeys-lru, como no compose local.
  - type: keyvalue
    name: dentibot-redis
    region: virginia
    plan: free
    maxmemoryPolicy: allkeys-lru
    # Vazio = só serviços da própria conta, pela rede interna da Render.
    ipAllowList: []
