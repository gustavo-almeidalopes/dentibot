spring:
  application:
    name: dentibot-api

  # A aplicação conecta como dentibot_app: sem posse de tabela, sem superusuário.
  # Se algum dia alguém apontar isto para o role dono, o RLS para de valer sem
  # nenhum erro aparecer — ver docs/architecture/tenancy.md.
  datasource:
    url: ${DENTIBOT_DB_URL}
    username: ${DENTIBOT_DB_USER:dentibot_app}
    password: ${DENTIBOT_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DENTIBOT_DB_POOL:10}
      pool-name: dentibot-app

  # Flyway tem credencial própria, de um role que é dono do schema e não é a app.
  flyway:
    enabled: true
    url: ${DENTIBOT_DB_URL}
    user: ${DENTIBOT_DB_MIGRADOR_USER:dentibot_migrador}
    password: ${DENTIBOT_DB_MIGRADOR_PASSWORD}
    schemas: plataforma
    default-schema: plataforma
    create-schemas: true
    validate-on-migrate: true
    # Migration aplicada nunca muda (invariante 13). Se o checksum divergir, é
    # porque alguém editou — e o certo é falhar, não "reparar".
    clean-disabled: true

  data:
    redis:
      url: ${DENTIBOT_REDIS_URL:redis://localhost:6379}
      # Redis cair degrada, não corrompe (camada 11). Timeout curto para não
      # segurar a requisição esperando o cache.
      timeout: 500ms
      connect-timeout: 500ms

  threads:
    virtual:
      enabled: true

dentibot:
  clerk:
    # A Frontend API da instância, exatamente como vem no claim `iss` do token.
    # É daqui que sai a URL do JWKS; sem ela nenhuma rota autenticada funciona.
    # Não é segredo (é público e vai no bundle do front), mas continua vindo de
    # variável porque muda entre ambientes.
    emissor: ${DENTIBOT_CLERK_ISSUER:}
    # Origens que o claim `azp` pode conter. Lista vazia desliga a checagem —
    # só faz sentido em teste, onde não há browser do outro lado.
    partes-autorizadas: ${DENTIBOT_CLERK_ORIGINS:http://localhost:5173}
  cors:
    origens: ${DENTIBOT_CORS_ORIGINS:http://localhost:5173}
  # Camada de DENTRO do rate limit. A camada de borda (Cloudflare) barra volume
  # antes de consumir thread da aplicação — as duas existem e fazem coisas
  # diferentes (camada 12).
  ratelimit:
    # Apertado: /api/v1/auth/cadastro cria clínica e é a rota que roda sem
    # tenant. Tentativa de senha não passa mais por aqui — é do Clerk.
    auth-por-minuto: ${DENTIBOT_RATELIMIT_AUTH:10}
    geral-por-minuto: ${DENTIBOT_RATELIMIT_GERAL:300}
    janela: PT1M

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      # Detalhe de health revela topologia interna para quem não precisa.
      show-details: when-authorized
  health:
    redis:
      enabled: true

logging:
  level:
    root: INFO
    br.com.dentibot: ${DENTIBOT_LOG_LEVEL:INFO}
  pattern:
    # correlacaoId no padrão de log é o que permite responder "sumiu a agenda de
    # ontem" com log em vez de chute.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlacaoId:-}] %logger{36} - %msg%n"
